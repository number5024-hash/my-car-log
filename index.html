<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>내 차 정비 이력장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E7EAEA;
    --card: #F6F7F4;
    --card-edge: #D8DCDA;
    --ink: #1B2A2E;
    --ink-soft: #52676B;
    --ink-faint: #8B9C9E;
    --accent: #C1501C;
    --accent-soft: #E8C7B3;
    --accent-ink: #FFF5EE;
    --teal: #2F5D5A;
    --teal-soft: #D7E4DF;
    --danger: #A32E2E;
    --line: #C9CFC9;
    --shadow: rgba(27,42,46,0.10);
    --font-ui: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12181A;
      --card: #1B2225;
      --card-edge: #2A3335;
      --ink: #E9EEEC;
      --ink-soft: #9FB0AF;
      --ink-faint: #62726F;
      --accent: #E07840;
      --accent-soft: #4A3226;
      --accent-ink: #2A1B12;
      --teal: #7FB6AE;
      --teal-soft: #21302E;
      --danger: #E07070;
      --line: #2E3739;
      --shadow: rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #12181A;
    --card: #1B2225;
    --card-edge: #2A3335;
    --ink: #E9EEEC;
    --ink-soft: #9FB0AF;
    --ink-faint: #62726F;
    --accent: #E07840;
    --accent-soft: #4A3226;
    --accent-ink: #2A1B12;
    --teal: #7FB6AE;
    --teal-soft: #21302E;
    --danger: #E07070;
    --line: #2E3739;
    --shadow: rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    padding-top: calc(56px + env(safe-area-inset-top));
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  /* ---- Top bar ---- */
  .topbar {
    padding: 4px 18px 6px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .topbar .brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: var(--ink-soft); }
  .topbar .brand b { color: var(--accent); }

  /* ---- Vehicle card ---- */
  .vcard {
    margin: 6px 16px 14px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 4px;
    padding: 16px 18px 13px;
    position: relative;
  }
  .vcard::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 18px);
    border-radius: 4px 4px 0 0;
  }
  .vcard .vname { font-size: 14px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
  .vcard .odo-row { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 11px; }
  .vcard .odo { font-family: var(--font-mono); font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
  .vcard .odo-unit { font-size: 13px; color: var(--ink-faint); padding-bottom: 3px; }
  .vcard .odo-edit { margin-left: auto; font-size: 11.5px; color: var(--teal); padding-bottom: 5px; border: none; background: none; font-family: var(--font-ui); cursor: pointer; text-decoration: underline; }
  .vcard .stat-row { display: flex; border-top: 1px dashed var(--line); padding-top: 10px; gap: 10px; }
  .vstat { flex: 1; }
  .vstat .lbl { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 3px; }
  .vstat .val { font-family: var(--font-mono); font-size: 16px; font-weight: 700; }

  /* ---- Tabs content ---- */
  .screen { display: none; padding: 0 16px; }
  .screen.active { display: block; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 2px 2px 6px; display: flex; align-items: center; justify-content: space-between; }
  .section-title a { font-size: 12px; color: var(--teal); font-weight: 500; text-decoration: none; }

  /* ---- Timeline ---- */
  .timeline { border-top: 1px solid var(--line); }
  .rec {
    display: flex;
    gap: 11px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .rec:active { background: var(--card); }
  .rec .icon {
    width: 34px; height: 34px; flex: none;
    border-radius: 50%;
    background: var(--teal-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .rec .body { flex: 1; min-width: 0; }
  .rec .title { font-size: 14.5px; font-weight: 700; margin-bottom: 2px; }
  .rec .meta { font-size: 12px; color: var(--ink-faint); font-family: var(--font-mono); }
  .rec .meta span + span::before { content: " · "; }
  .rec .cost { font-family: var(--font-mono); font-weight: 700; font-size: 14.5px; white-space: nowrap; align-self: center; }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-faint);
  }
  .empty .big { font-size: 32px; margin-bottom: 10px; }
  .empty p { font-size: 13.5px; line-height: 1.6; margin: 0 0 16px; }

  /* ---- Search / filter (history tab) ---- */
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 4px; padding: 10px 12px; margin: 10px 0 12px;
  }
  .search-box input {
    border: none; background: none; outline: none; flex: 1;
    font-family: var(--font-ui); font-size: 14px; color: var(--ink);
  }
  .search-box input::placeholder { color: var(--ink-faint); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 4px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    font-size: 12.5px; font-weight: 500;
    padding: 7px 13px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: var(--teal); border-color: var(--teal); color: #fff; }

  /* ---- Tab bar ---- */
  .tabbar {
    position: fixed;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: var(--card);
    border-top: 1px solid var(--card-edge);
    display: flex;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  .tab-btn {
    flex: 1; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 0;
    color: var(--ink-faint);
    font-family: var(--font-ui);
  }
  .tab-btn .ic { font-size: 19px; }
  .tab-btn .lb { font-size: 10.5px; font-weight: 500; }
  .tab-btn.active { color: var(--accent); }

  .fab {
    position: fixed;
    bottom: calc(82px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(calc(-50% + 190px));
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 25px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px var(--shadow);
    cursor: pointer;
    z-index: 25;
  }
  @media (max-width: 480px) {
    .fab { transform: none; right: 16px; left: auto; }
  }

  /* ---- Stats card (settings) ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 4px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card h3 { font-size: 13.5px; margin: 0 0 12px; color: var(--ink-soft); font-weight: 700; }
  .period-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .period-btn {
    flex: 1; padding: 7px 0; text-align: center; font-size: 12.5px; font-weight: 500;
    border: 1px solid var(--line); border-radius: 4px; background: var(--paper);
    color: var(--ink-soft); cursor: pointer;
  }
  .period-btn.active { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .stat-big-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-big { flex: 1; }
  .stat-big .lbl { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 4px; }
  .stat-big .val { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 8px; }
  .bar-row .cat-lbl { width: 56px; flex: none; color: var(--ink-soft); }
  .bar-track { flex: 1; height: 8px; background: var(--paper); border-radius: 100px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 100px; }
  .bar-row .cat-val { font-family: var(--font-mono); width: 70px; text-align: right; flex: none; }

  /* ---- Form fields ---- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-bottom: 6px; }
  .field label .opt { color: var(--ink-faint); font-weight: 400; }
  .field input, .field select, .field textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 11px 12px;
    font-family: var(--font-ui);
    font-size: 14.5px;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); }
  .field textarea { resize: vertical; min-height: 60px; }
  .cat-select { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-opt {
    padding: 9px 13px; border-radius: 100px; border: 1px solid var(--line);
    background: var(--paper); font-size: 13px; cursor: pointer; color: var(--ink-soft);
  }
  .cat-opt.active { background: var(--teal); border-color: var(--teal); color: #fff; }

  .btn {
    display: block; width: 100%; text-align: center;
    padding: 13px; border-radius: 4px; border: none;
    font-family: var(--font-ui); font-size: 14.5px; font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--card); color: var(--ink-soft); border: 1px solid var(--line); }
  .btn-danger { background: none; color: var(--danger); border: 1px solid var(--danger); }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  /* ---- Modal / sheet ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,15,16,0.45);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; max-width: 480px;
    background: var(--paper);
    border-radius: 16px 16px 0 0;
    max-height: 88vh;
    overflow-y: auto;
    padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
    animation: sheetUp 0.22s ease-out;
  }
  @keyframes sheetUp { from { transform: translateY(30px); opacity: 0.4; } to { transform: translateY(0); opacity: 1; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sheet-head h2 { font-size: 16.5px; margin: 0; }
  .sheet-close { border: none; background: none; font-size: 20px; color: var(--ink-faint); cursor: pointer; padding: 4px; }

  /* ---- Detail sheet ---- */
  .d-head { margin-bottom: 4px; }
  .d-cat { font-size: 12px; color: var(--teal); font-weight: 700; margin-bottom: 4px; }
  .d-title { font-size: 19px; font-weight: 700; margin-bottom: 14px; }
  .d-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .d-row .k { color: var(--ink-faint); }
  .d-row .v { font-weight: 600; text-align: right; }
  .d-row .v.mono { font-family: var(--font-mono); }
  .d-note { margin-top: 14px; padding: 12px 14px; background: var(--card); border-radius: 4px; font-size: 13.5px; line-height: 1.6; color: var(--ink-soft); }
  .d-interval {
    margin-top: 12px; padding: 10px 14px; background: var(--accent-soft); color: var(--accent);
    border-radius: 4px; font-size: 12.5px; font-weight: 600;
  }
  .d-actions { display: flex; gap: 8px; margin-top: 18px; }

  .toast {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    padding: 10px 18px; border-radius: 100px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
    z-index: 60; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="brand">🔧 내 차 <b>정비이력장</b></div>
  </div>

  <div class="vcard">
    <div class="vname" id="vc-name">차량 정보를 등록해주세요</div>
    <div class="odo-row">
      <div class="odo" id="vc-odo">0</div>
      <div class="odo-unit">km</div>
      <button class="odo-edit" onclick="openOdoEdit()">주행거리 수정</button>
    </div>
    <div class="stat-row">
      <div class="vstat">
        <div class="lbl">최근 정비</div>
        <div class="val" id="vc-last">-</div>
      </div>
      <div class="vstat">
        <div class="lbl">올해 정비비</div>
        <div class="val" id="vc-yearcost">0원</div>
      </div>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="section-title">최근 정비 <a href="#" onclick="switchTab('history');return false;">전체보기 &rsaquo;</a></div>
    <div class="timeline" id="home-list"></div>
  </div>

  <!-- HISTORY -->
  <div class="screen" id="screen-history">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="정비 항목, 업체, 메모 검색" oninput="renderHistory()">
    </div>
    <div class="chips" id="chip-row"></div>
    <div class="timeline" id="history-list"></div>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="screen-settings">
    <div class="card">
      <h3>💰 정비비용</h3>
      <div class="period-row" id="period-row"></div>
      <div class="stat-big-row">
        <div class="stat-big">
          <div class="lbl">정비 횟수</div>
          <div class="val" id="st-count">0회</div>
        </div>
        <div class="stat-big">
          <div class="lbl">총 정비비</div>
          <div class="val" id="st-total">0원</div>
        </div>
      </div>
      <div id="st-bars"></div>
    </div>

    <div class="card">
      <h3>🚗 차량 정보</h3>
      <div class="field">
        <label>차종</label>
        <input type="text" id="set-name" placeholder="예: 쉐보레 말리부 1.5 터보 (2017년식)">
      </div>
      <div class="field">
        <label>차량번호 <span class="opt">(선택)</span></label>
        <input type="text" id="set-plate" placeholder="예: 12가 3456">
      </div>
      <div class="field">
        <label>연료 <span class="opt">(선택)</span></label>
        <input type="text" id="set-fuel" placeholder="예: 가솔린 터보">
      </div>
      <div class="field">
        <label>배기량 <span class="opt">(선택)</span></label>
        <input type="text" id="set-disp" placeholder="예: 1,353cc">
      </div>
      <div class="field">
        <label>보험 만료일 <span class="opt">(선택)</span></label>
        <input type="date" id="set-ins">
      </div>
      <div class="field">
        <label>자동차검사일 <span class="opt">(선택)</span></label>
        <input type="date" id="set-insp">
      </div>
      <button class="btn btn-primary" onclick="saveVehicle()">차량 정보 저장</button>
    </div>

    <div class="card">
      <h3>⚙️ 데이터 관리</h3>
      <div class="btn-row" style="margin-bottom:8px;">
        <button class="btn btn-ghost" onclick="exportData()">내보내기</button>
        <button class="btn btn-ghost" onclick="document.getElementById('import-file').click()">가져오기</button>
      </div>
      <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(event)">
      <button class="btn btn-danger" onclick="resetAll()">전체 초기화</button>
    </div>
  </div>

  <button class="fab" onclick="openRecordForm()">＋</button>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="home" onclick="switchTab('home')">
      <span class="ic">🏠</span><span class="lb">내 차</span>
    </button>
    <button class="tab-btn" data-tab="history" onclick="switchTab('history')">
      <span class="ic">🔧</span><span class="lb">정비이력</span>
    </button>
    <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">
      <span class="ic">⚙️</span><span class="lb">설정</span>
    </button>
  </div>
</div>

<!-- Record form sheet -->
<div class="overlay" id="form-overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="form-title">정비 기록 추가</h2>
      <button class="sheet-close" onclick="closeSheet('form-overlay')">✕</button>
    </div>
    <input type="hidden" id="f-id">
    <div class="field">
      <label>정비 항목</label>
      <div class="cat-select" id="f-cat-select"></div>
    </div>
    <div class="field">
      <label>정비명</label>
      <input type="text" id="f-title" placeholder="예: 엔진오일 교환">
    </div>
    <div class="field">
      <label>정비일</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>주행거리 (km)</label>
      <input type="number" id="f-odo" placeholder="예: 128430" inputmode="numeric">
    </div>
    <div class="field">
      <label>비용 (원)</label>
      <input type="number" id="f-cost" placeholder="예: 65000" inputmode="numeric">
    </div>
    <div class="field">
      <label>정비업체 <span class="opt">(선택)</span></label>
      <input type="text" id="f-shop" placeholder="예: 공임나라 ○○점">
    </div>
    <div class="field">
      <label>부품명 <span class="opt">(선택)</span></label>
      <input type="text" id="f-parts" placeholder="예: Kixx PAO 5W-30">
    </div>
    <div class="field">
      <label>메모 <span class="opt">(선택)</span></label>
      <textarea id="f-memo" placeholder="예: 다음 교환 135,000km 예정"></textarea>
    </div>
    <button class="btn btn-primary" onclick="saveRecord()">저장</button>
  </div>
</div>

<!-- Detail sheet -->
<div class="overlay" id="detail-overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>정비 상세</h2>
      <button class="sheet-close" onclick="closeSheet('detail-overlay')">✕</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<!-- Odometer edit sheet -->
<div class="overlay" id="odo-overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>현재 주행거리 수정</h2>
      <button class="sheet-close" onclick="closeSheet('odo-overlay')">✕</button>
    </div>
    <div class="field">
      <label>현재 주행거리 (km)</label>
      <input type="number" id="odo-input" inputmode="numeric">
    </div>
    <button class="btn btn-primary" onclick="saveOdo()">저장</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CATEGORIES = [
    { key: 'engine',  label: '엔진',    icon: '🛢' },
    { key: 'tire',    label: '타이어',  icon: '🛞' },
    { key: 'brake',   label: '브레이크', icon: '🛑' },
    { key: 'battery', label: '배터리',  icon: '🔋' },
    { key: 'etc',     label: '기타',    icon: '🔧' },
  ];
  const catMap = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));

  const STORE_KEY_VEHICLE = 'carlog_vehicle_v1';
  const STORE_KEY_RECORDS = 'carlog_records_v1';

  function loadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      console.error('load failed', key, e);
      return fallback;
    }
  }
  function saveJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('save failed', key, e);
      return false;
    }
  }

  const DEFAULT_VEHICLE = {
    name: '쉐보레 말리부 1.5 터보 (2017년식)',
    plate: '', fuel: '', disp: '', ins: '', insp: '', odo: 0
  };

  let vehicle = loadJSON(STORE_KEY_VEHICLE, { ...DEFAULT_VEHICLE });
  let records = loadJSON(STORE_KEY_RECORDS, []);

  let historyFilter = 'all';
  let statsPeriod = 'year';
  let editingRecordId = null;

  /* ---------- Persistent store (db 캡슐, localStorage는 캐시 용도) ---------- */
  let db = null;
  let vehicleRef = null;
  let recordsRef = null;
  let dbVehicleLoaded = false;
  let dbRecordsLoaded = false;

  async function initStore() {
    try {
      db = window.claude ? await window.claude.use('db') : null;
    } catch (e) {
      db = null;
    }
    if (!db) return; // db를 못 쓰는 뷰어에서는 localStorage만으로 계속 동작

    vehicleRef = db.doc('vehicle/main');
    recordsRef = db.collection('records');

    vehicleRef.onSnapshot((snap) => {
      if (snap.exists) {
        vehicle = { ...DEFAULT_VEHICLE, ...snap.data() };
      } else if (!dbVehicleLoaded) {
        vehicleRef.set(vehicle).catch(e => console.error('vehicle seed failed', e));
      }
      dbVehicleLoaded = true;
      saveJSON(STORE_KEY_VEHICLE, vehicle);
      renderVehicleCard();
      if (document.getElementById('screen-settings').classList.contains('active')) renderSettings();
    }, (e) => console.error('vehicle sync error', e));

    recordsRef.onSnapshot((snap) => {
      if (snap.empty && !dbRecordsLoaded && records.length > 0) {
        records.forEach(r => {
          const { id, ...rest } = r;
          recordsRef.doc(id).set(rest).catch(e => console.error('record seed failed', e));
        });
      } else {
        records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      }
      dbRecordsLoaded = true;
      saveJSON(STORE_KEY_RECORDS, records);
      renderAll();
    }, (e) => console.error('records sync error', e));
  }

  async function persistVehicle() {
    saveJSON(STORE_KEY_VEHICLE, vehicle);
    if (!vehicleRef) return;
    try {
      await vehicleRef.set(vehicle);
    } catch (e) {
      console.error('vehicle save failed', e);
      toast('저장에 실패했어요. 다시 시도해주세요');
    }
  }
  async function persistRecordUpsert(record) {
    saveJSON(STORE_KEY_RECORDS, records);
    if (!recordsRef) return;
    const { id, ...rest } = record;
    try {
      await recordsRef.doc(id).set(rest);
    } catch (e) {
      console.error('record save failed', e);
      toast('저장에 실패했어요. 다시 시도해주세요');
    }
  }
  async function persistRecordDelete(id) {
    saveJSON(STORE_KEY_RECORDS, records);
    if (!recordsRef) return;
    try {
      await recordsRef.doc(id).delete();
    } catch (e) {
      console.error('record delete failed', e);
      toast('삭제에 실패했어요. 다시 시도해주세요');
    }
  }

  function fmtWon(n) { return (n || 0).toLocaleString('ko-KR') + '원'; }
  function fmtKm(n) { return (n || 0).toLocaleString('ko-KR'); }
  function fmtDate(d) {
    if (!d) return '-';
    const [y,m,day] = d.split('-');
    return `${y}.${m}.${day}`;
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1600);
  }

  function switchTab(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    if (name === 'history') renderHistory();
    if (name === 'settings') renderSettings();
  }

  function openSheet(id) { document.getElementById(id).classList.add('open'); }
  function closeSheet(id) { document.getElementById(id).classList.remove('open'); }

  /* ---------- Vehicle card ---------- */
  function renderVehicleCard() {
    document.getElementById('vc-name').textContent = vehicle.name || '차량 정보를 등록해주세요';
    document.getElementById('vc-odo').textContent = fmtKm(vehicle.odo);
    const sorted = [...records].sort((a,b) => b.date.localeCompare(a.date));
    document.getElementById('vc-last').textContent = sorted.length ? fmtDate(sorted[0].date) : '-';
    const thisYear = new Date().getFullYear().toString();
    const yearCost = records.filter(r => r.date.startsWith(thisYear)).reduce((s,r) => s + (r.cost||0), 0);
    document.getElementById('vc-yearcost').textContent = fmtWon(yearCost);
  }

  function openOdoEdit() {
    document.getElementById('odo-input').value = vehicle.odo || '';
    openSheet('odo-overlay');
  }
  function saveOdo() {
    const val = parseInt(document.getElementById('odo-input').value, 10);
    if (isNaN(val) || val < 0) { toast('올바른 주행거리를 입력해주세요'); return; }
    vehicle.odo = val;
    persistVehicle();
    renderVehicleCard();
    closeSheet('odo-overlay');
    toast('주행거리를 수정했어요');
  }

  /* ---------- Home timeline ---------- */
  function recordRowHTML(r) {
    const cat = catMap[r.category] || catMap.etc;
    return `
      <div class="rec" onclick="openDetail('${r.id}')">
        <div class="icon">${cat.icon}</div>
        <div class="body">
          <div class="title">${escapeHTML(r.title)}</div>
          <div class="meta"><span>${fmtDate(r.date)}</span><span>${fmtKm(r.odo)}km</span>${r.shop ? `<span>${escapeHTML(r.shop)}</span>` : ''}</div>
        </div>
        <div class="cost">${fmtWon(r.cost)}</div>
      </div>`;
  }

  function escapeHTML(s) {
    if (!s) return '';
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderHome() {
    const sorted = [...records].sort((a,b) => b.date.localeCompare(a.date) || (b.odo - a.odo));
    const list = document.getElementById('home-list');
    if (!sorted.length) {
      list.innerHTML = `<div class="empty"><div class="big">🧾</div><p>아직 등록된 정비 기록이 없어요.<br>오른쪽 아래 + 버튼으로 첫 기록을 추가해보세요.</p></div>`;
      return;
    }
    list.innerHTML = sorted.slice(0, 5).map(recordRowHTML).join('');
  }

  /* ---------- History tab ---------- */
  function renderChips() {
    const row = document.getElementById('chip-row');
    const all = [{key:'all', label:'전체', icon:''}, ...CATEGORIES];
    row.innerHTML = all.map(c => `
      <div class="chip ${historyFilter === c.key ? 'active' : ''}" onclick="setHistoryFilter('${c.key}')">${c.icon ? c.icon + ' ' : ''}${c.label}</div>
    `).join('');
  }
  function setHistoryFilter(key) {
    historyFilter = key;
    renderChips();
    renderHistory();
  }
  function renderHistory() {
    renderChips();
    const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
    let filtered = [...records];
    if (historyFilter !== 'all') filtered = filtered.filter(r => r.category === historyFilter);
    if (q) {
      filtered = filtered.filter(r =>
        (r.title||'').toLowerCase().includes(q) ||
        (r.shop||'').toLowerCase().includes(q) ||
        (r.memo||'').toLowerCase().includes(q) ||
        (r.parts||'').toLowerCase().includes(q)
      );
    }
    filtered.sort((a,b) => b.date.localeCompare(a.date) || (b.odo - a.odo));
    const list = document.getElementById('history-list');
    if (!filtered.length) {
      list.innerHTML = `<div class="empty"><div class="big">🔍</div><p>조건에 맞는 정비 기록이 없어요.</p></div>`;
      return;
    }
    list.innerHTML = filtered.map(recordRowHTML).join('');
  }

  /* ---------- Detail sheet ---------- */
  function openDetail(id) {
    const r = records.find(x => x.id === id);
    if (!r) return;
    const cat = catMap[r.category] || catMap.etc;
    let intervalHTML = '';
    const prior = records
      .filter(x => x.category === r.category && x.date < r.date)
      .sort((a,b) => b.date.localeCompare(a.date))[0];
    if (prior) {
      const kmDiff = r.odo - prior.odo;
      if (kmDiff > 0) {
        intervalHTML = `<div class="d-interval">직전 '${escapeHTML(cat.label)}' 정비(${fmtDate(prior.date)}) 이후 ${fmtKm(kmDiff)}km 주행 후 정비</div>`;
      }
    }
    document.getElementById('detail-body').innerHTML = `
      <div class="d-head">
        <div class="d-cat">${cat.icon} ${cat.label}</div>
        <div class="d-title">${escapeHTML(r.title)}</div>
      </div>
      <div class="d-row"><div class="k">정비일</div><div class="v mono">${fmtDate(r.date)}</div></div>
      <div class="d-row"><div class="k">주행거리</div><div class="v mono">${fmtKm(r.odo)} km</div></div>
      <div class="d-row"><div class="k">비용</div><div class="v mono">${fmtWon(r.cost)}</div></div>
      ${r.shop ? `<div class="d-row"><div class="k">정비업체</div><div class="v">${escapeHTML(r.shop)}</div></div>` : ''}
      ${r.parts ? `<div class="d-row"><div class="k">부품</div><div class="v">${escapeHTML(r.parts)}</div></div>` : ''}
      ${intervalHTML}
      ${r.memo ? `<div class="d-note">${escapeHTML(r.memo)}</div>` : ''}
      <div class="d-actions">
        <button class="btn btn-ghost" onclick="closeSheet('detail-overlay'); openRecordForm('${r.id}')">수정</button>
        <button class="btn btn-danger" onclick="deleteRecord('${r.id}')">삭제</button>
      </div>
    `;
    openSheet('detail-overlay');
  }

  function deleteRecord(id) {
    if (!confirm('이 정비 기록을 삭제할까요?')) return;
    records = records.filter(r => r.id !== id);
    persistRecordDelete(id);
    closeSheet('detail-overlay');
    renderAll();
    toast('기록을 삭제했어요');
  }

  /* ---------- Record form ---------- */
  let formCat = 'engine';
  function openRecordForm(id) {
    editingRecordId = id || null;
    const title = document.getElementById('form-title');
    document.getElementById('f-id').value = id || '';
    if (id) {
      const r = records.find(x => x.id === id);
      title.textContent = '정비 기록 수정';
      formCat = r.category;
      document.getElementById('f-title').value = r.title;
      document.getElementById('f-date').value = r.date;
      document.getElementById('f-odo').value = r.odo;
      document.getElementById('f-cost').value = r.cost;
      document.getElementById('f-shop').value = r.shop || '';
      document.getElementById('f-parts').value = r.parts || '';
      document.getElementById('f-memo').value = r.memo || '';
    } else {
      title.textContent = '정비 기록 추가';
      formCat = 'engine';
      document.getElementById('f-title').value = '';
      document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
      document.getElementById('f-odo').value = vehicle.odo || '';
      document.getElementById('f-cost').value = '';
      document.getElementById('f-shop').value = '';
      document.getElementById('f-parts').value = '';
      document.getElementById('f-memo').value = '';
    }
    renderCatSelect();
    openSheet('form-overlay');
  }

  function renderCatSelect() {
    const el = document.getElementById('f-cat-select');
    el.innerHTML = CATEGORIES.map(c => `
      <div class="cat-opt ${formCat === c.key ? 'active' : ''}" onclick="setFormCat('${c.key}')">${c.icon} ${c.label}</div>
    `).join('');
  }
  function setFormCat(key) { formCat = key; renderCatSelect(); }

  function saveRecord() {
    const title = document.getElementById('f-title').value.trim();
    const date = document.getElementById('f-date').value;
    const odo = parseInt(document.getElementById('f-odo').value, 10);
    const cost = parseInt(document.getElementById('f-cost').value, 10);
    if (!title) { toast('정비명을 입력해주세요'); return; }
    if (!date) { toast('정비일을 입력해주세요'); return; }
    if (isNaN(odo)) { toast('주행거리를 입력해주세요'); return; }
    if (isNaN(cost)) { toast('비용을 입력해주세요'); return; }

    const shop = document.getElementById('f-shop').value.trim();
    const parts = document.getElementById('f-parts').value.trim();
    const memo = document.getElementById('f-memo').value.trim();

    let record;
    if (editingRecordId) {
      record = records.find(x => x.id === editingRecordId);
      Object.assign(record, { title, date, odo, cost, category: formCat, shop, parts, memo });
    } else {
      record = {
        id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        title, date, odo, cost, category: formCat, shop, parts, memo
      };
      records.push(record);
    }
    persistRecordUpsert(record);
    if (odo > (vehicle.odo || 0)) {
      vehicle.odo = odo;
      persistVehicle();
    }
    closeSheet('form-overlay');
    renderAll();
    toast(editingRecordId ? '수정했어요' : '기록을 추가했어요');
  }

  /* ---------- Settings: vehicle form ---------- */
  function renderSettings() {
    document.getElementById('set-name').value = vehicle.name || '';
    document.getElementById('set-plate').value = vehicle.plate || '';
    document.getElementById('set-fuel').value = vehicle.fuel || '';
    document.getElementById('set-disp').value = vehicle.disp || '';
    document.getElementById('set-ins').value = vehicle.ins || '';
    document.getElementById('set-insp').value = vehicle.insp || '';
    renderPeriodRow();
    renderStats();
  }
  function saveVehicle() {
    vehicle.name = document.getElementById('set-name').value.trim();
    vehicle.plate = document.getElementById('set-plate').value.trim();
    vehicle.fuel = document.getElementById('set-fuel').value.trim();
    vehicle.disp = document.getElementById('set-disp').value.trim();
    vehicle.ins = document.getElementById('set-ins').value;
    vehicle.insp = document.getElementById('set-insp').value;
    persistVehicle();
    renderVehicleCard();
    toast('차량 정보를 저장했어요');
  }

  /* ---------- Settings: stats ---------- */
  const PERIODS = [{key:'month', label:'이번 달'}, {key:'year', label:'올해'}, {key:'all', label:'전체'}];
  function renderPeriodRow() {
    document.getElementById('period-row').innerHTML = PERIODS.map(p => `
      <div class="period-btn ${statsPeriod === p.key ? 'active' : ''}" onclick="setStatsPeriod('${p.key}')">${p.label}</div>
    `).join('');
  }
  function setStatsPeriod(key) { statsPeriod = key; renderPeriodRow(); renderStats(); }
  function renderStats() {
    const now = new Date();
    const ym = now.toISOString().slice(0,7);
    const y = now.getFullYear().toString();
    let filtered = records;
    if (statsPeriod === 'month') filtered = records.filter(r => r.date.startsWith(ym));
    if (statsPeriod === 'year') filtered = records.filter(r => r.date.startsWith(y));
    document.getElementById('st-count').textContent = filtered.length + '회';
    const total = filtered.reduce((s,r) => s + (r.cost||0), 0);
    document.getElementById('st-total').textContent = fmtWon(total);

    const byCat = {};
    filtered.forEach(r => { byCat[r.category] = (byCat[r.category]||0) + (r.cost||0); });
    const entries = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
    const max = entries.length ? entries[0][1] : 1;
    const bars = document.getElementById('st-bars');
    if (!entries.length) {
      bars.innerHTML = `<div style="font-size:12.5px;color:var(--ink-faint);padding-top:4px;">해당 기간의 정비 기록이 없어요.</div>`;
    } else {
      bars.innerHTML = entries.map(([key, val]) => {
        const cat = catMap[key] || catMap.etc;
        const pct = Math.max(6, Math.round((val / max) * 100));
        return `
          <div class="bar-row">
            <div class="cat-lbl">${cat.icon} ${cat.label}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="cat-val">${fmtWon(val)}</div>
          </div>`;
      }).join('');
    }
  }

  /* ---------- Data management ---------- */
  async function exportData() {
    const payload = { vehicle, records, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const filename = 'my-car-log-' + new Date().toISOString().slice(0,10) + '.json';
    try {
      const downloads = window.claude ? await window.claude.use('downloads') : null;
      if (downloads) {
        await downloads.save({ filename, data: blob });
        toast('내보내기 완료');
        return;
      }
    } catch (e) {
      if (e && e.code === 'declined') return;
      console.error(e);
    }
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('내보내기 완료');
    } catch (e) {
      console.error(e);
      toast('내보내기에 실패했어요');
    }
  }
  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.vehicle) vehicle = { ...DEFAULT_VEHICLE, ...data.vehicle };
        if (Array.isArray(data.records)) records = data.records;
        saveJSON(STORE_KEY_VEHICLE, vehicle);
        saveJSON(STORE_KEY_RECORDS, records);
        renderAll();
        toast('가져오기 완료');
        if (recordsRef) {
          try {
            const existing = await recordsRef.get();
            await Promise.all(existing.docs.map(d => recordsRef.doc(d.id).delete()));
            await Promise.all(records.map(r => {
              const { id, ...rest } = r;
              return recordsRef.doc(id).set(rest);
            }));
          } catch (e) { console.error('import records sync failed', e); }
        }
        if (vehicleRef) {
          try { await vehicleRef.set(vehicle); } catch (e) { console.error('import vehicle sync failed', e); }
        }
      } catch (e) {
        console.error(e);
        toast('파일을 읽지 못했어요');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }
  async function resetAll() {
    if (!confirm('모든 차량 정보와 정비 기록을 삭제할까요? 이 작업은 되돌릴 수 없어요.')) return;
    vehicle = { ...DEFAULT_VEHICLE, name: '', odo: 0 };
    records = [];
    saveJSON(STORE_KEY_VEHICLE, vehicle);
    saveJSON(STORE_KEY_RECORDS, records);
    renderAll();
    toast('초기화했어요');
    if (recordsRef) {
      try {
        const existing = await recordsRef.get();
        await Promise.all(existing.docs.map(d => recordsRef.doc(d.id).delete()));
      } catch (e) { console.error('reset records sync failed', e); }
    }
    if (vehicleRef) {
      try { await vehicleRef.set(vehicle); } catch (e) { console.error('reset vehicle sync failed', e); }
    }
  }

  function renderAll() {
    renderVehicleCard();
    renderHome();
    renderHistory();
    renderSettings();
  }

  renderAll();
  initStore();
</script>
</body>
</html>
